# Include only within the existing www.finfold.cn HTTPS server block.
# This endpoint is independent of the public-only site's disabled /api/ routes.
location ^~ /__finfold/wechat-egress/ {
    client_max_body_size 12m;
    access_log off;
    error_log /dev/null;
    proxy_pass http://127.0.0.1:8788/;
    proxy_pass_request_headers off;
    proxy_set_header Host localhost;
    proxy_set_header Content-Type $content_type;
    proxy_set_header Content-Length $content_length;
    proxy_set_header X-Finfold-Wechat-Egress-Token $http_x_finfold_wechat_egress_token;
    proxy_read_timeout 40s;
    proxy_connect_timeout 5s;
}
