# Display-only CN launch. The authenticated product stays on finfold.app.
server {
    listen 80;
    listen [::]:80;
    server_name www.finfold.cn finfold.cn;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://www.finfold.cn$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name finfold.cn;
    ssl_certificate /etc/letsencrypt/live/www.finfold.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.finfold.cn/privkey.pem;
    return 301 https://www.finfold.cn$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.finfold.cn;
    ssl_certificate /etc/letsencrypt/live/www.finfold.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.finfold.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # No CN application endpoints are public in this launch.
    location ^~ /api/ {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 503 '{"error":"国内站业务接口尚未开放，请使用 www.finfold.app。"}';
    }
    location = / { proxy_pass http://127.0.0.1:3000; }
    location ~ ^/(?:blog|use-cases)(?:/|$) { proxy_pass http://127.0.0.1:3000; }
    location ~ ^/(?:guide|privacy|terms|refund|support)/?$ { proxy_pass http://127.0.0.1:3000; }
    location ~ ^/en(?:/|$) { proxy_pass http://127.0.0.1:3000; }
    location ^~ /_next/static/ { proxy_pass http://127.0.0.1:3000; }
    location = /_next/image { proxy_pass http://127.0.0.1:3000; }
    location ~ ^/(?:landing|editorial|brand|sounds|lottie|media)/ { proxy_pass http://127.0.0.1:3000; }
    location ~ ^/(?:favicon\.ico|icon(?:\.png)?|apple-icon(?:\.png)?|opengraph-image|robots\.txt|sitemap\.xml|manifest\.webmanifest)$ { proxy_pass http://127.0.0.1:3000; }
    location / {
        if ($request_method !~ ^(GET|HEAD)$) { return 503; }
        return 302 https://www.finfold.app$request_uri;
    }
}
